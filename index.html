<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alternate History Story</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#f6f1e7; --panel:#fffdf8; --ink:#2b2620; --muted:#7a6f62; --line:#e4dccd;
  --accent:#8a4b16; --sel:#f0e3cf; --chip:#efe7d9;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#191612; --panel:#221e19; --ink:#ece4d6; --muted:#a39785; --line:#363027;
    --accent:#e0a060; --sel:#3a3026; --chip:#2e2821; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
body{position:fixed;inset:0}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif}

.app{display:flex;height:100dvh}
nav.side{width:190px;flex:none;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
nav.side h1{font-size:19px;line-height:1.2;margin:0 0 16px;color:var(--accent)}
.tabbtn{text-align:left;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabbtn.on{background:var(--sel);color:var(--ink)}
main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0}
.view.on{display:flex}

/* Ideas */
#ideas{flex-direction:column}
.top{padding:12px 16px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.strip{display:flex;gap:3px}
.seg{flex:1;min-width:0;padding:6px 4px;border-radius:6px;text-align:center;font-size:12px;line-height:1.2;
  border:2px solid transparent;transition:transform .12s}
.seg:active{transform:scale(.96)}
.seg b{display:block;font-size:15px}
.seg.on{border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:4px 10px;border-radius:99px;background:var(--chip);font-size:13px;white-space:nowrap;border:1px solid transparent}
.chip.on{border-color:var(--ink);background:var(--sel)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.split{flex:1;min-height:0;display:flex}
.list{flex:1;min-width:0;overflow-y:auto;padding:4px 0 20px}
.grp{position:sticky;top:0;background:var(--bg);padding:10px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);z-index:1}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px;text-align:left;border-left:3px solid transparent}
.row:hover{background:var(--sel)}
.row.on{background:var(--sel);border-left-color:var(--accent)}
.row .dot{width:9px;height:9px;border-radius:50%;flex:none}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .star{color:#c98a12;font-size:13px}
.tm{flex:none;font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px;color:#1d1a16;min-width:54px;text-align:center}
.detail{width:380px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:20px}
.detail h2{margin:4px 0 6px;font-size:22px;line-height:1.2}
.meta{font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
.facts > span:nth-child(odd){color:var(--muted)}
.then{font-size:14px;background:var(--chip);border-radius:8px;padding:8px 10px;margin:12px 0}
.then b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.imp i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:3px}
.imp i.f{background:var(--accent)}
.desc{font-size:16px;margin:12px 0}
.links h3{font-size:13px;font-family:inherit;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.links button{display:inline-block;margin:0 6px 6px 0;padding:3px 9px;border-radius:99px;background:var(--chip);font-size:13px}
.empty{color:var(--muted);padding:40px 20px;text-align:center}
.q{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--muted);font-size:11px;color:var(--muted);margin-left:4px;vertical-align:1px}
.tip{display:none;font-size:13px;color:var(--muted);background:var(--chip);padding:8px 10px;border-radius:8px;margin-top:6px}
.tip.on{display:block}

/* Notes */
.notelist{width:220px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:12px 8px}
.notelist button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:14px}
.notelist button.on{background:var(--sel);font-weight:600}
.notesel{display:none}
.doc{flex:1;min-width:0;overflow-y:auto;padding:16px 28px 40px}
.doc .inner{max-width:760px}
.doc h1{font-size:28px;color:var(--accent)} .doc h2{font-size:21px;margin-top:28px} .doc h3{font-size:17px}
.doc table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0;display:block;overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.doc th{background:var(--chip)}
.doc a{color:var(--accent)}
.doc blockquote{border-left:3px solid var(--line);margin:0;padding-left:12px;color:var(--muted)}

/* Map */
#map{flex-direction:column}
#map .top{border-bottom:1px solid var(--line)}
#leaf{flex:1;min-height:0;background:var(--bg)}
.leaflet-popup-content{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:10px 12px}
.leaflet-popup-content b{font-family:Georgia,serif;font-size:16px;display:block}
.leaflet-popup-content .f{color:#7a6f62;font-size:12px}
.chips .sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
.civlbl{background:none;border:0;box-shadow:none;padding:0;font-size:11px;font-weight:600;color:#3a2f25;text-shadow:0 0 3px #fff,0 0 3px #fff}
.civlbl:before{display:none}
#leaf.z-lo .civlbl,#leaf.z-mid .civlbl:not(.big){display:none}
#rmap:not(.z-lbl) .civlbl.rl{display:none}

/* Home: one section per location */
#home{flex-direction:column}
.cards{flex:1;min-height:0;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}
.cardh{grid-column:1/-1;margin:0;font-size:22px;color:var(--accent)}
.card{text-align:left;background:var(--panel);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;transition:transform .12s}
.card:hover{background:var(--sel)}
.card:active{transform:scale(.98)}
.card .nm{display:flex;align-items:baseline;gap:8px;font:600 19px/1.2 Georgia,serif}
.card .sc{margin-left:auto;font:700 13px/1 -apple-system,sans-serif;padding:3px 7px;border-radius:99px;color:#1d1a16}
.card .ttl{color:var(--accent);font-style:italic;font-size:14px}
.card .pt{color:var(--muted);font-size:14px}
#home.showr .cards{display:none}
.region{display:none;flex:1;min-height:0;flex-direction:column}
#home.showr .region{display:flex}
.rhead{display:flex;align-items:center;gap:10px}
.rhead .bk{font-size:22px;line-height:1;padding:2px 8px 4px;border-radius:8px;background:var(--chip)}
.rhead .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .t b{font:600 18px Georgia,serif}
.rhead .t span{color:var(--accent);font-style:italic;margin-left:6px}
.rhead .pl{padding:4px 10px;border-radius:99px;background:var(--chip);font-size:13px;flex:none}
.rbody{flex:1;min-height:0;display:flex}
#rmap{flex:1;min-width:0;background:var(--bg)}
.rpanel{width:390px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:8px 0 24px}
.ritem{display:block;width:100%;text-align:left;padding:9px 16px;border-bottom:1px solid var(--line);font-size:14px}
.ritem:hover,.ritem.on{background:var(--sel)}
.ritem b,.rpop b{font:600 15px Georgia,serif}
.ritem .f,.rpop .f{display:block;color:var(--muted);font-size:12px}
.ritem i.d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.ritem div,.rpop div{margin-top:3px}
.ritem em,.rpop em{color:var(--muted)}
.rov{padding:4px 16px}
.rov p{margin:6px 0 10px}
.rov .facts{margin:8px 0}
.rov h3{font:700 12px/1 -apple-system,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.rov a{color:var(--accent)}
.rov ul{margin:0;padding-left:18px;font-size:13px}
.ricon{display:flex;align-items:center;justify-content:center;line-height:1}
.ricon .badge{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#fffdf8;border:2px solid;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.ricon .badge.near{border-style:dashed;opacity:.9}
.ricon.ppl,.ricon.pin{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.ricon.pin{font-size:22px}
.rpop{max-width:300px}
.rbody{position:relative}
.rcard{display:none;position:absolute;top:10px;width:320px;max-width:none;max-height:calc(100% - 20px);overflow:hidden;z-index:1000;pointer-events:none;
  background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px;box-shadow:0 4px 18px rgba(0,0,0,.3);font-size:14px}
.rcard b{font:600 16px Georgia,serif}
.rcard .f{display:block;color:var(--muted);font-size:12px}
.rimg{margin:0 0 8px}
.rimg img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;background:var(--chip)}
.rimg figcaption{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
.rimg figcaption a{color:var(--muted)}
.leaflet-popup-content .rimg img{width:280px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal .rimg{margin:0}
.ph{display:flex;gap:8px;align-items:flex-start}
.ph .pe{font-size:22px;line-height:1.1}
.ph b{display:block}
.rows{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:6px;font-size:13px}
.rows > span:nth-child(odd){color:var(--muted);font-size:12px;white-space:nowrap}
.leaflet-popup-content .rows > span:nth-child(odd){color:#7a6f62}

/* Simulation (North America) */
.sim{display:none;flex:1;min-height:0;overflow-y:auto;padding:12px 16px 24px}
#simchips{display:none}
#home.showsim .rbody,#home.showsim #rchips{display:none}
#home.showsim .sim,#home.showsim #simchips{display:flex}
.sim{flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--panel);border-radius:12px;padding:10px 14px}
.tile b{display:block;font:600 24px/1.15 Georgia,serif}
.tile span{color:var(--muted);font-size:12px}
.simg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cbox{background:var(--panel);border-radius:12px;padding:10px 12px;min-width:0}
.cbox.wide{grid-column:1/-1}
.cbox h4{margin:0 0 6px;font:700 13px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.cbox h4 .chips{display:inline-flex;margin-left:8px;vertical-align:middle}
.cbox .cv{position:relative;height:230px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.minis .cbox{padding:8px 10px}
.minis h4{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.minis h4 b{color:var(--ink)}
.minis .cv{height:70px}
.stab{border-collapse:collapse;font-size:12.5px;width:100%}
.stab th,.stab td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:right;white-space:nowrap}
.stab th:first-child,.stab td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
.stab th{color:var(--muted);font-weight:600}
.tscroll{overflow:auto;max-height:100%}
.gantt{display:grid;grid-template-columns:minmax(150px,240px) 1fr 54px;gap:3px 10px;align-items:center;font-size:12.5px}
.gantt .bar{position:relative;height:12px;background:var(--chip);border-radius:3px}
.gantt .bar i{position:absolute;top:0;bottom:0;border-radius:3px;min-width:4px}
.gantt .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .yr{color:var(--muted);text-align:right}
.gantt .ax{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.evs{font-size:13px;max-height:420px;overflow-y:auto}
.evs div{padding:3px 0;border-bottom:1px solid var(--line)}
.evs span{color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-bottom:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.snote{font-size:13px;color:var(--muted)}
.snote b{color:var(--ink)}

/* Phone */
.tabbar{display:none}
.sheetbg{display:none}
@media (max-width:860px){
  .app{flex-direction:column}
  nav.side{display:none}
  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar .tabbtn{flex:1;text-align:center;padding:12px 0;border-radius:0}
  .tabbar .tabbtn.on{background:none;color:var(--accent)}
  .top{padding:10px 12px 8px}
  .seg{font-size:10px;padding:5px 1px}
  .seg b{font-size:14px}
  .row{padding:9px 12px}
  .grp{padding:10px 12px 4px}
  .detail{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:78dvh;border-left:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;z-index:20;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -8px 30px rgba(0,0,0,.2);
    padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .detail.open{transform:none}
  .detail .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 10px}
  .sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:19}
  .sheetbg.on{display:block}
  #notes{flex-direction:column}
  .notelist{display:none}
  .notesel{display:block;margin:10px 12px 0;padding:8px 10px;font:inherit;font-size:15px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .doc{padding:8px 16px 30px}
  .doc h1{font-size:23px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px 12px;gap:8px}
  .cardh{font-size:19px}
  .card{padding:10px 12px}
  .card .nm{font-size:16px}
  .card .ttl{font-size:13px}
  .card .pt{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .rbody{flex-direction:column}
  #rmap{flex:0 0 50%}
  .rpanel{width:auto;flex:1;min-height:0;border-left:0;border-top:1px solid var(--line)}
  .sim{padding:10px 12px 20px;gap:10px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile{padding:8px 12px}
  .tile b{font-size:20px}
  .simg{grid-template-columns:1fr;gap:10px}
  .cbox .cv{height:200px}
  .minis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .gantt{grid-template-columns:minmax(110px,40%) 1fr 40px;font-size:12px}
}
.grab{display:none}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <h1>Alternate History Story</h1>
    <button class="tabbtn on" data-tab="home">Home</button>
    <button class="tabbtn" data-tab="ideas">Ideas</button>
    <button class="tabbtn" data-tab="map">Map</button>
    <button class="tabbtn" data-tab="notes">Notes</button>
  </nav>
  <main>
    <section class="view on" id="home">
      <div class="cards" id="cards"></div>
      <div class="region">
        <div class="top">
          <div class="rhead"><button class="bk" id="rback" aria-label="Back">‹</button><div class="t" id="rtitle"></div><button class="pl" id="rsim" hidden>Simulation</button><button class="pl" id="rplan">Full plan</button></div>
          <div class="chips" id="rchips"></div>
          <div class="chips" id="simchips"></div>
        </div>
        <div class="rbody"><div id="rmap"></div><div class="rcard rpop" id="rcard"></div><div class="rpanel" id="rpanel"></div></div>
        <div class="sim" id="sim"></div>
      </div>
    </section>
    <section class="view" id="ideas">
      <div class="top">
        <div class="strip" id="strip"></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="split">
        <div class="list" id="list"></div>
        <aside class="detail" id="detail"></aside>
      </div>
    </section>
    <section class="view" id="map">
      <div class="top"><div class="chips" id="mapmode"></div><div class="chips" id="mapchips"></div></div>
      <div id="leaf"></div>
    </section>
    <section class="view" id="notes">
      <div class="notelist" id="notelist"></div>
      <select class="notesel" id="notesel"></select>
      <div class="doc"><div class="inner" id="doc"></div></div>
    </section>
  </main>
  <div class="tabbar">
    <button class="tabbtn on" data-tab="home">Home</button>
    <button class="tabbtn" data-tab="ideas">Ideas</button>
    <button class="tabbtn" data-tab="map">Map</button>
    <button class="tabbtn" data-tab="notes">Notes</button>
  </div>
</div>
<div class="sheetbg" id="sheetbg"></div>

<script>
const BUCKETS = [
  {label:"Instant–2 mo", short:"<2 mo", max:2},
  {label:"3–11 months", short:"3–11 mo", max:11},
  {label:"1–2 years", short:"1–2 yr", max:24},
  {label:"3–5 years", short:"3–5 yr", max:60},
  {label:"6–10 years", short:"6–10 yr", max:120},
  {label:"11–20 years", short:"11–20 yr", max:240},
  {label:"21–50 years", short:"21–50 yr", max:600},
  {label:"50+ years", short:"50+ yr", max:Infinity},
];
// green (fast) → red (slow)
const BUCKET_COLORS = ["#7cc47a","#a6cf6f","#cdd46a","#e9c45f","#eda25a","#e6805a","#d9665f","#c0504f"];
const CAT_COLORS = {Health:"#d0574f",Food:"#6aa84f",Math:"#4f7fc7",Society:"#9b6bc4",Communication:"#3fa7a3",
  Military:"#7d6a5a",Chemistry:"#d08b2c",Tools:"#5e6f80",Industry:"#a0522d",Electricity:"#c9b02a",Exploration:"#2f8fd0",Knowledge:"#b0569a"};
const NOTES = [
  ["direction.md","The idea"],["brainstorm/variations.md","Six variations"],
  ["brainstorm/variations/north-america.md","① North America"],["brainstorm/sim-north-america.md","① Simulation 1243–1282"],["brainstorm/variations/southern-africa.md","② Southern Africa"],
  ["brainstorm/variations/britain.md","③ Britain"],["brainstorm/variations/java.md","④ Java"],
  ["brainstorm/variations/andes.md","⑤ Andes"],["brainstorm/variations/sweden.md","⑥ Sweden"],
  ["brainstorm/fitting-in-and-conflict.md","Fitting in & keeping peace"],
  ["brainstorm/ideas-inbox.md","Ideas inbox"],["brainstorm/timeline.md","How long things take"],
  ["brainstorm/tech-tree.md","Tech tree"],["brainstorm/chemistry.md","Chemistry"],["brainstorm/tools-that-make-tools.md","Tools that make tools"],
  ["brainstorm/pure-knowledge.md","Pure knowledge"],["brainstorm/long-term-tech.md","Long-term tech"],
  ["brainstorm/trade-and-wealth.md","Trade & wealth"],["brainstorm/ships-1200s.md","Ships"],["brainstorm/location-shortlist.md","Location top 10"],["brainstorm/location-factors.md","Water, weather, food & more"],["brainstorm/culture-acceptance.md","Will they accept him?"],["brainstorm/homeland.md","Where to build"],["brainstorm/two-stage-start.md","Start here, build there"],["brainstorm/dates-and-series.md","Dates & series idea"],["brainstorm/government.md","Government"],["brainstorm/population.md","Population"],["brainstorm/rise-to-power.md","Rising to power"],["brainstorm/resources.md","Resources"],
  ["brainstorm/world-1200s.md","The world in 1230"],["brainstorm/people-1200s.md","Famous people 1200–1250"],["brainstorm/events-1200s.md","Events 1200–1350"],["brainstorm/time-periods.md","Time periods"],

let ideas = [], byName = {}, state = {bucket:null, cat:null, simple:false, trade:false, sel:null};
const $ = s => document.querySelector(s);
const bucketOf = m => BUCKETS.findIndex(b => m <= b.max);
const fmt = m => m === 0 ? "Instant" : m < 12 ? m + " mo" : (m % 12 ? (m/12).toFixed(1) : m/12) + " yr";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fromZero(it, seen = new Set()){
  if (it._z != null) return it._z;
  if (seen.has(it.n)) return it.m;
  seen.add(it.n);
  const pre = it.p.map(n => byName[n]).filter(Boolean).map(x => fromZero(x, seen));
  return it._z = it.m + (pre.length ? Math.max(...pre) : 0);
}

function visible(){
  return ideas.filter(it => (state.cat == null || it.c === state.cat) && (!state.simple || it.s) && (!state.trade || it.t));

}

function renderList(){

  }
  borderLayer = L.geoJSON(borders[mapYear], {
    attribution: 'Borders: <a href="https://github.com/aourednik/historical-basemaps">historical-basemaps</a>',
    style: f => {
      const c = civInfo(f.properties.NAME);
      const fill = mapMode === "civs" ? civColor(f.properties.SUBJECTO || f.properties.NAME)
        : mapMode === "religion" ? RELIGIONS[c.r][1]
        : c.p == null ? "#e6e6e6" : POP_BINS.find(b => c.p < b[0])[2];
      const dim = mapMode === "religion" && relSel && c.r !== relSel;
      return {color:"#5a4a3a", weight:.6, fillColor:fill, fillOpacity: dim ? .08 : .6};
    },
    onEachFeature: (f, l) => {
      const c = civInfo(f.properties.NAME), sub = f.properties.SUBJECTO;
      pop(l, `<b>${esc(c.n)}</b><span class="f">${RELIGIONS[c.r][0]} · ${c.p == null ? "population unknown" : "~" + c.p + "M people"}` +
        `${sub && sub !== f.properties.NAME ? " · part of " + esc(sub) : ""}</span>`);
      if (c.p >= 1) l.bindTooltip(esc(c.n.replace(/ \(.*\)$/, "")), {permanent:true, direction:"center", className:"civlbl" + (c.p >= 5 ? " big" : "")});
    }
  }).addTo(leaf);
}
function drawRes(){
  if (resLayer) resLayer.remove();
  const cells = {};
  places.filter(p => RES_TYPES.includes(p.t)).forEach(p => {
    const k = Math.floor(p.la / 5) + "," + Math.floor(p.lo / 5);
    (cells[k] = cells[k] || []).push(p);
  });
  resLayer = L.layerGroup(Object.entries(cells).map(([k, ps]) => {
    const [a, o] = k.split(",").map(Number), b = RES_BINS.find(x => ps.length <= x[0]);
    return pop(L.rectangle([[a * 5, o * 5], [a * 5 + 5, o * 5 + 5]], {weight:0, fillColor:b[2], fillOpacity:.75}),
      `<b>${ps.length} resource site${ps.length > 1 ? "s" : ""}</b><div>${ps.map(p => esc(p.n) + " (" + p.t + ")").join("<br>")}</div>`);
  })).addTo(leaf);
}
$("#mapmode").onclick = e => {
  const c = e.target.closest(".chip"); if (!c) return;
  if (c.dataset.m){ mapMode = c.dataset.m; relSel = null; }
  if (c.dataset.y) mapYear = c.dataset.y;
  drawMap();
};
$("#mapchips").onclick = e => {
  const c = e.target.closest(".chip"); if (!c) return;
  if (c.dataset.t != null) mapType = c.dataset.t || null;
  else if (c.dataset.r) relSel = relSel === c.dataset.r ? null : c.dataset.r;
  else return;
  drawMap();
};

// Notes
$("#notelist").innerHTML = NOTES.map(([f, t]) => `<button data-f="${f}">${t}</button>`).join("");
$("#notesel").innerHTML = NOTES.map(([f, t]) => `<option value="${f}">${t}</option>`).join("");
$("#notelist").onclick = e => { const b = e.target.closest("button"); if (b) openNote(b.dataset.f); };
$("#notesel").onchange = e => openNote(e.target.value);
async function openNote(f){
  document.querySelectorAll("#notelist button").forEach(b => b.classList.toggle("on", b.dataset.f === f));
  $("#notesel").value = f;
  try {
    const txt = await (await fetch(f, {cache:"no-cache"})).text();
    $("#doc").innerHTML = marked.parse(txt);
    $("#doc").parentElement.scrollTop = 0;
    $("#doc").dataset.f = f;
  } catch { $("#doc").innerHTML = `<p class="empty">Couldn't load this note.</p>`; }
}
$("#doc").onclick = e => {
  const a = e.target.closest("a"); if (!a) return;
  const href = a.getAttribute("href") || "";
  if (/^https?:/.test(href) || !href.endsWith(".md")) return;
  e.preventDefault();
  const base = ($("#doc").dataset.f || "").split("/").slice(0, -1);
  href.split("/").forEach(p => p === ".." ? base.pop() : p !== "." && base.push(p));
  const f = base.join("/");
  if (NOTES.some(n => n[0] === f)) openNote(f);
};

fetch("data/ideas.json", {cache:"no-cache"}).then(r => r.json()).then(data => {
  ideas = data; ideas.forEach(it => byName[it.n] = it);
  if (!matchMedia("(max-width:860px)").matches) state.sel = ideas[0].n;
  renderAll();
});
</script>
</body>
